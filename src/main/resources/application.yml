# ============================================================
# Trade Risk Monitoring & Analytics Platform
# Common Configuration
# ============================================================

spring:
  application:
    name: trade-risk-platform

  # ---- JPA / Hibernate ----
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: update

  # ---- Jackson ----
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

# ---- Server ----
server:
  port: 8080
  servlet:
    context-path: /api/v1

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ---- Logging ----
logging:
  level:
    com.riskmanagement: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ---- JWT ----
app:
  jwt:
    secret: ${JWT_SECRET:dGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9yVHJhZGVSaXNrUGxhdGZvcm1Kd3RUb2tlblNpZ25pbmc=}
    expiration-ms: ${JWT_EXPIRATION:86400000}

# ---- Risk Engine ----
risk:
  engine:
    var-confidence-level: 0.95
    var-holding-period-days: 1
    default-volatility: 0.02
    market-data-refresh-interval-ms: 60000

# ---- OpenAPI / Swagger ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
