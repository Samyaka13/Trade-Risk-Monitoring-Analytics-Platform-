# ============================================================
# DEV Profile — H2 In-Memory Database
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:traderisk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

logging:
  level:
    com.riskmanagement: DEBUG
